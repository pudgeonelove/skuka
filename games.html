<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ПОЛЕ / ИГРЫ — мини-игры на двоих</title>
<style>
:root{--bg:#07080f;--fg:#eef0ff;--mut:#8b90b5;--a:#6df0d2;--b:#ff7aa8;--line:rgba(255,255,255,.14);--ease:cubic-bezier(.2,.8,.2,1);
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--fg);font:400 15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.scr{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;padding:calc(22px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom));overflow:auto;
 opacity:0;visibility:hidden;translate:0 22px;transition:opacity .45s var(--ease),translate .45s var(--ease),visibility 0s .45s}
.scr.on{opacity:1;visibility:visible;translate:0 0;transition-delay:0s}
.mono{font:500 .72rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--a)}
h1{font:italic 700 clamp(3.6rem,19vw,6.6rem)/.88 var(--serif);letter-spacing:-.045em;text-align:center}
h1 em{color:var(--a)}h2{font:italic 700 2rem var(--serif);letter-spacing:-.02em;text-align:center}
.lead{color:#b4b9dc;text-align:center;max-width:26rem}
.btn{display:block;width:min(100%,380px);padding:17px 22px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.06);backdrop-filter:blur(14px);text-align:left;cursor:pointer;transition:transform .25s var(--ease),background .25s,border-color .25s}
.btn:active{transform:scale(.97)}.btn:hover{border-color:var(--a)}
.btn b{display:block;font:italic 700 1.35rem var(--serif)}.btn span{font:.76rem var(--mono);color:var(--mut)}
.btn.pri{background:var(--a);color:#07080f;border-color:transparent}.btn.pri span{color:rgba(7,8,15,.65)}
.mid{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;padding:18px 0}
.glass{width:min(100%,420px);padding:20px;border:1px solid var(--line);border-radius:24px;background:rgba(10,12,28,.6);backdrop-filter:blur(16px)}
.code{font:700 3.2rem/1 var(--mono);letter-spacing:.12em;text-align:center;color:var(--a);margin:10px 0;text-shadow:0 0 30px var(--a)}
.chip{font:500 .78rem var(--mono);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:99px;padding:10px 16px;cursor:pointer}
.chip:active{background:var(--a);color:#07080f}
input{width:100%;font:700 1.6rem var(--mono);letter-spacing:.3em;text-align:center;text-transform:uppercase;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:16px;padding:12px;outline:0;user-select:text;-webkit-user-select:text}
input:focus{border-color:var(--a)}
.st{font:.8rem var(--mono);color:var(--mut);text-align:center;min-height:1.3em;margin-top:8px}
.dots i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--a);animation:dot 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{opacity:.2;translate:0 0}50%{opacity:1;translate:0 -4px}}
.top{display:flex;width:min(100%,560px);justify-content:space-between;align-items:center;margin-bottom:6px}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(100%,560px);margin-top:14px}
.game{padding:16px 14px;border:1px solid var(--line);border-radius:22px;background:rgba(10,12,28,.6);backdrop-filter:blur(14px);text-align:left;cursor:pointer;transition:transform .25s var(--ease),border-color .25s}
.game:active{transform:scale(.96)}.game:hover{border-color:var(--a)}.game.lock{opacity:.45;pointer-events:none}
.game svg{width:62px;height:62px;color:var(--a);display:block;margin-bottom:8px;overflow:visible}
.game b{display:block;font:italic 700 1.2rem var(--serif)}.game span{font:.7rem var(--mono);color:var(--mut)}
.puck{animation:puck 1.6s ease-in-out infinite alternate}@keyframes puck{from{translate:-14px -16px}to{translate:12px 14px}}
.fall{animation:fall 1.5s cubic-bezier(.5,0,1,.6) infinite}@keyframes fall{0%{translate:0 -20px;opacity:0}20%{opacity:1}70%,100%{translate:0 24px;opacity:1}}
.flash{animation:flash 1.6s steps(1) infinite;transform-origin:32px 32px}@keyframes flash{0%{fill:#555a80;scale:.7}60%{fill:currentColor;scale:1.15}100%{fill:currentColor;scale:1}}
.knot{animation:knot 1.1s ease-in-out infinite alternate}@keyframes knot{from{translate:-16px 0}to{translate:16px 0}}
#play{padding:calc(10px + env(safe-area-inset-top)) 0 calc(10px + env(safe-area-inset-bottom))}
#stage{position:relative;flex:1;width:100%;display:grid;place-items:center;min-height:0}
#cv{touch-action:none;border-radius:18px;box-shadow:0 20px 70px rgba(0,0,0,.6);border:1px solid var(--line)}
#over{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:12px;background:rgba(7,8,15,.72);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
#over.on{opacity:1;visibility:visible;transition-delay:0s}
#over h2{font-size:clamp(2.4rem,11vw,3.6rem)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));translate:-50% 20px;opacity:0;max-width:88vw;padding:12px 18px;border-radius:16px;font:.8rem/1.4 var(--mono);background:rgba(10,12,28,.95);border:1px solid var(--line);z-index:9;transition:.5s var(--ease);pointer-events:none;text-align:center}
.toast.on{opacity:1;translate:-50% 0}
.pal{position:fixed;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:5;display:flex;gap:8px}
.pal button{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.35);cursor:pointer}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="pal" id="pal"><button style="background:#6df0d2" aria-label="Аврора"></button><button style="background:#ffa95e" aria-label="Закат"></button><button style="background:#b9d4ff" aria-label="Нефть"></button></div>

<section class="scr on" id="home"><div class="mid">
  <p class="mono">Мини-игры на двоих</p>
  <h1>ПОЛЕ<br><em>ИГРЫ</em></h1>
  <p class="lead">Четыре быстрые игры. Играйте вдвоём на одном телефоне — или каждый со своего, по коду комнаты.</p>
  <button class="btn pri" id="bLocal"><b>Один телефон</b><span>положите между собой и играйте</span></button>
  <button class="btn" id="bNet"><b>Два телефона</b><span>соединение по коду, без регистрации</span></button>
</div></section>

<section class="scr" id="net"><div class="top"><button class="chip" data-go="home">← Назад</button><span class="mono">По сети</span></div>
<div class="mid">
  <div class="glass"><p class="mono">Вы хозяин</p>
    <div id="hostBox"><button class="btn pri" id="bHost" style="margin-top:12px"><b>Создать комнату</b><span>получите код для друга</span></button></div>
    <div id="codeBox" hidden><div class="code" id="code">-----</div>
      <div style="display:flex;gap:8px;justify-content:center"><button class="chip" id="bShare">Отправить ссылку</button><button class="chip" id="bCopy">Копировать код</button></div></div>
  </div>
  <div class="glass"><p class="mono">Вы гость</p><input id="inCode" maxlength="5" placeholder="КОД" autocomplete="off" style="margin:12px 0"><button class="btn" id="bJoin"><b>Войти в комнату</b><span>введите код друга</span></button></div>
  <p class="st" id="netSt"></p>
</div></section>

<section class="scr" id="menu"><div class="top"><button class="chip" id="bMenuBack">← Выйти</button><span class="mono" id="menuMode">Один телефон</span></div>
<h2 style="margin-top:8px">Выберите игру</h2><p class="st" id="menuHint"></p>
<div class="games" id="games"></div></section>

<section class="scr" id="play">
  <div class="top" style="padding:0 16px"><button class="chip" id="bPlayBack">← Меню</button><span class="mono" id="playName"></span></div>
  <div id="stage"><canvas id="cv"></canvas>
    <div id="over"><p class="mono" id="overSub"></p><h2 id="overTitle"></h2><button class="btn pri" id="bAgain" style="width:240px"><b>Реванш</b><span>сыграть ещё раз</span></button><button class="btn" id="bToMenu" style="width:240px"><b>В меню</b><span>другая игра</span></button><p class="st" id="overWait"></p></div></div>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v)), lerp = (a, b, t) => a + (b - a) * t, rnd = (a, b) => a + Math.random() * (b - a);
const FW = 360, FH = 640, PI = Math.PI;
const ACC = ['#6df0d2', '#ffa95e', '#b9d4ff']; const COL = [ACC[0], '#ff7aa8'];
let mode = 'local', me = 0, cur = null, S = null, snap = null, scr = 'home', seen = 0, overOn = false, sendT = 0, dt = 0;
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('on'), 4200); };
const show = id => { scr = id; $$('.scr').forEach(s => s.classList.toggle('on', s.id === id)); };

/* ═════════ Sound, haptics, particles ═════════ */
let ac = null; addEventListener('pointerdown', () => { if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch {} ac && ac.resume(); }, { once: false });
const beep = (f, d = .09, ty = 'triangle') => { if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(); o.type = ty; o.frequency.value = f; g.gain.setValueAtTime(.07, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d); };
const FX = [], burst = (x, y, col, n = 14) => { for (let i = 0; i < n; i++) { const a = rnd(0, 2 * PI), s = rnd(60, 280); FX.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: rnd(.4, .9), col }); } };
function fxEv(s) { if (s.ev !== seen) { seen = s.ev; if (s.e) { burst(s.e[0], s.e[1], COL[s.e[2]] || '#fff', s.e[3] || 14); beep(300 + (s.e[2] || 0) * 140 + rnd(0, 60)); navigator.vibrate && navigator.vibrate(12); } } }
function drawFX(c) { for (let i = FX.length - 1; i >= 0; i--) { const p = FX[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.vy *= .96; if ((p.l -= dt) <= 0) { FX.splice(i, 1); continue; } c.globalAlpha = clamp(p.l * 2, 0, 1); c.fillStyle = p.col; c.beginPath(); c.arc(p.x, p.y, 2.5, 0, 7); c.fill(); } c.globalAlpha = 1; }
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); };
const text = (c, t, x, y, size, col, rot = 0, a = 1) => { c.save(); c.translate(x, y); c.rotate(rot); c.globalAlpha = a; c.fillStyle = col; c.font = `italic 700 ${size}px Georgia,serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(t, 0, 0); c.restore(); };
const glow = (c, col, b) => { c.shadowColor = col; c.shadowBlur = b; };

/* ═════════ GAMES — every game: init / input / step (host or local only) / render (from state alone) ═════════ */
const hockey = { id: 'hockey', name: 'Аэрохоккей', zone: 'half',
  init: () => ({ pk: { x: 180, y: 320, vx: 0, vy: 0 }, pd: [{ x: 180, y: 560, vx: 0, vy: 0, tx: 180, ty: 560 }, { x: 180, y: 80, vx: 0, vy: 0, tx: 180, ty: 80 }], sc: [0, 0], frz: 1, ev: 0, e: null, over: false, w: -1 }),
  input(s, p, x, y) { const d = s.pd[p]; d.tx = clamp(x, 28, 332); d.ty = p ? clamp(y, 28, 300) : clamp(y, 340, 612); },
  step(s, dt) {
    if (s.over) return;
    for (const d of s.pd) { const nx = lerp(d.x, d.tx, Math.min(1, dt * 24)), ny = lerp(d.y, d.ty, Math.min(1, dt * 24)); d.vx = (nx - d.x) / dt; d.vy = (ny - d.y) / dt; d.x = nx; d.y = ny; }
    const k = s.pk; if (s.frz > 0) { s.frz -= dt; return; }
    k.x += k.vx * dt; k.y += k.vy * dt; const f = Math.pow(.6, dt); k.vx *= f; k.vy *= f;
    if (k.x < 14 || k.x > 346) { k.x = clamp(k.x, 14, 346); k.vx *= -.92; }
    const gate = k.x > 110 && k.x < 250;
    if (k.y < 14 && !gate) { k.y = 14; k.vy *= -.92; } if (k.y > 626 && !gate) { k.y = 626; k.vy *= -.92; }
    if (k.y < -12 || k.y > 652) { const w = k.y < 0 ? 0 : 1; s.sc[w]++; s.ev++; s.e = [k.x, w ? 640 : 0, w, 36]; Object.assign(k, { x: 180, y: 320, vx: 0, vy: 0 }); s.frz = 1.1; if (s.sc[w] >= 5) { s.over = true; s.w = w; } return; }
    for (const d of s.pd) { const dx = k.x - d.x, dy = k.y - d.y, dist = Math.hypot(dx, dy); if (dist < 41 && dist > 0) { const nx = dx / dist, ny = dy / dist; k.x = d.x + nx * 41; k.y = d.y + ny * 41; const rv = (k.vx - d.vx) * nx + (k.vy - d.vy) * ny; if (rv < 0) { k.vx -= 1.9 * rv * nx; k.vy -= 1.9 * rv * ny; } s.ev++; s.e = [k.x, k.y, s.pd.indexOf(d), 8]; } }
    const sp = Math.hypot(k.vx, k.vy); if (sp > 1300) { k.vx *= 1300 / sp; k.vy *= 1300 / sp; }
  },
  trail: [],
  render(c, s, t) {
    const g = c.createLinearGradient(0, 0, 0, FH); g.addColorStop(0, '#16183f'); g.addColorStop(.5, '#0a0c22'); g.addColorStop(1, '#16183f'); c.fillStyle = g; c.fillRect(0, 0, FW, FH);
    c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 2; c.beginPath(); c.moveTo(0, 320); c.lineTo(FW, 320); c.stroke(); c.beginPath(); c.arc(180, 320, 58, 0, 7); c.stroke();
    glow(c, COL[1], 18); c.strokeStyle = COL[1]; c.lineWidth = 5; c.beginPath(); c.moveTo(110, 2); c.lineTo(250, 2); c.stroke(); glow(c, COL[0], 18); c.strokeStyle = COL[0]; c.beginPath(); c.moveTo(110, FH - 2); c.lineTo(250, FH - 2); c.stroke(); glow(c, 'transparent', 0);
    text(c, s.sc[0], 180, 430, 120, COL[0], 0, .16); text(c, s.sc[1], 180, 210, 120, COL[1], PI, .16);
    const k = s.pk; this.trail.push([k.x, k.y]); if (this.trail.length > 14) this.trail.shift();
    this.trail.forEach(([x, y], i) => { c.globalAlpha = i / 30; c.fillStyle = '#fff'; c.beginPath(); c.arc(x, y, 12 * i / 14, 0, 7); c.fill(); }); c.globalAlpha = 1;
    glow(c, '#fff', 20); c.fillStyle = '#fff'; c.beginPath(); c.arc(k.x, k.y, 14, 0, 7); c.fill(); glow(c, 'transparent', 0);
    s.pd.forEach((d, i) => { const r = c.createRadialGradient(d.x - 8, d.y - 8, 4, d.x, d.y, 28); r.addColorStop(0, '#fff'); r.addColorStop(.35, COL[i]); r.addColorStop(1, '#05060d'); glow(c, COL[i], 22); c.fillStyle = r; c.beginPath(); c.arc(d.x, d.y, 27, 0, 7); c.fill(); glow(c, 'transparent', 0); c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 2; c.beginPath(); c.arc(d.x, d.y, 15, 0, 7); c.stroke(); });
    if (s.frz > 0 && !s.over) text(c, s.frz > .5 ? 'ГОТОВЬТЕСЬ' : 'ИГРАЕМ!', 180, 320, 28, '#fff', 0, .85);
  } };

const CC = 48, OX = 12, OY = 200;
function check4(b, r, c) { const v = b[r * 7 + c]; for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) { const cells = [[r, c]]; for (const s of [1, -1]) { let a = r + dr * s, d = c + dc * s; while (a >= 0 && a < 6 && d >= 0 && d < 7 && b[a * 7 + d] === v) { cells.push([a, d]); a += dr * s; d += dc * s; } } if (cells.length >= 4) return cells; } return null; }
const four = { id: 'four', name: 'Четыре в ряд', zone: 'turn',
  init: () => ({ b: Array(42).fill(0), turn: 0, hov: 3, drop: null, win: null, over: false, w: -1, ev: 0, e: null }),
  input(s, p, x, y, ev) { if (s.over || s.drop || p !== s.turn) return; const col = clamp(Math.floor((x - OX) / CC), 0, 6); s.hov = col;
    if (ev === 'up') { let r = 5; while (r >= 0 && s.b[r * 7 + col]) r--; if (r < 0) return; s.drop = { c: col, r, p, y: OY - 40, vy: 0 }; } },
  step(s, dt) { const d = s.drop; if (!d) return; d.vy += 2600 * dt; d.y += d.vy * dt; const ty = OY + d.r * CC + CC / 2;
    if (d.y >= ty) { s.b[d.r * 7 + d.c] = d.p + 1; s.drop = null; s.ev++; s.e = [OX + d.c * CC + CC / 2, ty, d.p, 12]; const w = check4(s.b, d.r, d.c);
      if (w) { s.win = w; s.over = true; s.w = d.p; } else if (s.b.every(Boolean)) { s.over = true; s.w = -1; } else s.turn = 1 - d.p; } },
  render(c, s, t) {
    const g = c.createLinearGradient(0, 0, 0, FH); g.addColorStop(0, '#12143a'); g.addColorStop(1, '#0a0c22'); c.fillStyle = g; c.fillRect(0, 0, FW, FH);
    const disc = (x, y, p, a = 1) => { const r = c.createRadialGradient(x - 5, y - 5, 2, x, y, 20); r.addColorStop(0, '#fff'); r.addColorStop(.3, COL[p]); r.addColorStop(1, '#05060d'); c.globalAlpha = a; glow(c, COL[p], 14); c.fillStyle = r; c.beginPath(); c.arc(x, y, 19, 0, 7); c.fill(); glow(c, 'transparent', 0); c.globalAlpha = 1; };
    for (let r = 0; r < 6; r++) for (let q = 0; q < 7; q++) { const v = s.b[r * 7 + q]; if (v) disc(OX + q * CC + CC / 2, OY + r * CC + CC / 2, v - 1); }
    if (s.drop) disc(OX + s.drop.c * CC + CC / 2, s.drop.y, s.drop.p);
    else if (!s.over) disc(OX + s.hov * CC + CC / 2, OY - 34, s.turn, .45 + .25 * Math.sin(t * 6));
    c.beginPath(); c.rect(OX - 6, OY - 6, CC * 7 + 12, CC * 6 + 12); for (let r = 0; r < 6; r++) for (let q = 0; q < 7; q++) { c.moveTo(OX + q * CC + CC / 2 + 20, OY + r * CC + CC / 2); c.arc(OX + q * CC + CC / 2, OY + r * CC + CC / 2, 20, 0, 7); }
    const bg = c.createLinearGradient(0, OY, 0, OY + 290); bg.addColorStop(0, '#3a3f9c'); bg.addColorStop(1, '#23276b'); c.fillStyle = bg; c.fill('evenodd');
    if (s.win) s.win.forEach(([r, q]) => { c.strokeStyle = '#fff'; c.lineWidth = 4; glow(c, '#fff', 16); c.globalAlpha = .6 + .4 * Math.sin(t * 8); c.beginPath(); c.arc(OX + q * CC + CC / 2, OY + r * CC + CC / 2, 23, 0, 7); c.stroke(); }); glow(c, 'transparent', 0); c.globalAlpha = 1;
    [[0, 560, 0], [1, 80, PI]].forEach(([p, y, rot]) => text(c, s.over ? '' : s.turn === p ? 'ВАШ ХОД' : 'ждёт…', 180, y, s.turn === p ? 34 : 22, COL[p], rot, s.turn === p && !s.over ? 1 : .35));
  } };

const duel = { id: 'duel', name: 'Дуэль', zone: 'half',
  init: () => ({ ph: 'wait', t: 0, dl: rnd(1.6, 4), sc: [0, 0], ms: [null, null], w: -1, r: 1, ev: 0, e: null, over: false, msg: '' }),
  input(s, p, x, y, ev) { if (ev !== 'down' || s.over) return;
    if (s.ph === 'wait') { s.ph = 'res'; s.t = 0; s.w = 1 - p; s.msg = 'Фальстарт!'; s.sc[1 - p]++; s.ev++; s.e = [180, p ? 480 : 160, 1 - p, 24]; }
    else if (s.ph === 'go') { s.ms[p] = Math.round(s.t * 1000); s.ph = 'res'; s.t = 0; s.w = p; s.msg = s.ms[p] + ' мс'; s.sc[p]++; s.ev++; s.e = [180, p ? 160 : 480, p, 30]; } },
  step(s, dt) { if (s.over) return; s.t += dt;
    if (s.ph === 'wait' && s.t >= s.dl) { s.ph = 'go'; s.t = 0; s.ev++; s.e = [180, 320, 0, 6]; }

  render(c, s, t) {

      const g = c.createLinearGradient(0, y0, 0, y0 + 320); g.addColorStop(0, lit ? COL[p] : '#10132f'); g.addColorStop(1, lit ? '#05060d' : '#0a0c22'); c.globalAlpha = lit ? k * .85 : dim ? .6 : 1; c.fillStyle = g; c.fillRect(0, y0, FW, 320); c.globalAlpha = 1;
      const msg = s.ph === 'wait' ? 'ЖДИ…' : s.ph === 'go' ? 'ЖМИ!' : s.w === p ? 'ПОБЕДА' : '', cy = p ? 150 : 490;
      text(c, msg, 180, cy, s.ph === 'go' ? 84 : 52, '#fff', rot, s.ph === 'wait' ? .5 + .3 * Math.sin(t * 4) : 1);
      if (s.ph === 'res') text(c, s.w === p ? s.msg : '', 180, p ? 215 : 425, 26, '#fff', rot, .9);
      for (let i = 0; i < 2; i++) { c.fillStyle = i < s.sc[p] ? COL[p] : 'rgba(255,255,255,.14)'; glow(c, i < s.sc[p] ? COL[p] : 'transparent', 12); c.beginPath(); c.arc(150 + i * 60, p ? 40 : 600, 10, 0, 7); c.fill(); glow(c, 'transparent', 0); } });

  } };

const tug = { id: 'tug', name: 'Канат', zone: 'half',

  step(s, dt) { s.pu = s.pu.map(v => Math.max(0, v - dt * 6)); if (s.ph === 'cnt') { const n = Math.ceil(s.t); s.t -= dt; if (s.t <= 0) { s.ph = 'play'; s.ev++; s.e = [180, 320, 0, 8]; } else if (Math.ceil(s.t) !== n) beep(500, .1); } else if (s.ph === 'play') s.x -= s.x * .25 * dt; },
  render(c, s, t) {

    [[0, 320, 0], [1, 0, PI]].forEach(([p, y0, rot]) => { const g = c.createLinearGradient(0, p ? y0 : y0 + 320, 0, p ? y0 + 320 : y0); g.addColorStop(0, COL[p]); g.addColorStop(1, 'transparent'); c.globalAlpha = .1 + s.pu[p] * .35; c.fillStyle = g; c.fillRect(0, y0, FW, 320); c.globalAlpha = 1;
      text(c, s.tp[p], 180, p ? 150 : 490, 96, COL[p], rot, .22 + s.pu[p] * .5); if (s.ph === 'play') text(c, 'ЖМИ!', 180, p ? 230 : 410, 30, '#fff', rot, .5 + .4 * Math.sin(t * 8)); });

const GAMES = [hockey, four, duel, tug];
const ICONS = { hockey: '<circle cx="32" cy="32" r="26" fill="none" stroke="currentColor" opacity=".3" stroke-width="2"/><circle class="puck" cx="32" cy="32" r="7" fill="currentColor"/><rect x="21" y="53" width="22" height="5" rx="2.5" fill="currentColor"/>',
  four: '<circle cx="14" cy="50" r="7" fill="currentColor" opacity=".35"/><circle cx="32" cy="50" r="7" fill="#ff7aa8"/><circle cx="50" cy="50" r="7" fill="currentColor" opacity=".35"/><circle class="fall" cx="32" cy="18" r="7" fill="currentColor"/>',
  duel: '<circle class="flash" cx="32" cy="32" r="20" fill="currentColor"/>', tug: '<path d="M6 32h52" stroke="currentColor" stroke-width="3" opacity=".4"/><circle class="knot" cx="32" cy="32" r="9" fill="currentColor"/>' };
const DESC = { hockey: 'до 5 голов', four: 'классика', duel: 'кто быстрее', tug: 'жми быстрее' };
GAMES.forEach(g => { const b = document.createElement('button'); b.className = 'game'; b.innerHTML = `<svg viewBox="0 0 64 64">${ICONS[g.id]}</svg><b>${g.name}</b><span>${DESC[g.id]}</span>`; b.onclick = () => host_start(g); $('#games').append(b); });

/* ═════════ Session: local / host / guest ═════════ */
let pc = null, dc = null, es = null, topic = '';
const send = o => { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(o)); };

function begin(g) { cur = g; S = mode === 'guest' ? null : g.init(); snap = null; seen = 0; hideOver(); $('#playName').textContent = g.name; show('play'); fit(); }
function toMenu() { hideOver(); cur = null; S = null; snap = null; setMenu(); show('menu'); }
function setMenu() { $('#menuMode').textContent = mode === 'local' ? 'Один телефон' : mode === 'host' ? 'Вы — хозяин' : 'Вы — гость'; $('#menuHint').textContent = mode === 'guest' ? 'Игру выбирает хозяин комнаты' : ''; $$('.game').forEach(b => b.classList.toggle('lock', mode === 'guest')); }
function toHome() { try { pc && pc.close(); es && es.close(); } catch {} pc = dc = es = null; mode = 'local'; me = 0; cur = null; S = null; snap = null; hideOver(); show('home'); }
$('#bLocal').onclick = () => { mode = 'local'; me = 0; setMenu(); show('menu'); };
$('#bNet').onclick = () => { $('#netSt').textContent = ''; show('net'); };
$$('[data-go]').forEach(b => b.onclick = () => { if (b.dataset.go === 'home') toHome(); else show(b.dataset.go); });
$('#bMenuBack').onclick = toHome;
$('#bPlayBack').onclick = () => { if (mode === 'guest') return toast('Меню выбирает хозяин'); toMenu(); send({ k: 'menu' }); };
$('#bToMenu').onclick = () => mode === 'guest' ? toHome() : (toMenu(), send({ k: 'menu' }));
$('#bAgain').onclick = () => host_start(cur);

/* ═════════ Networking: WebRTC data channel; ntfy.sh only carries the 2-message handshake (room code = topic) ═════════ */
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] }, NTFY = 'https://ntfy.sh/';
const netSt = m => $('#netSt').innerHTML = m;
const listen = fn => { es = new EventSource(NTFY + topic + '/sse?since=all'); es.onmessage = e => { try { const m = JSON.parse(e.data); if (m.event === 'message') fn(JSON.parse(m.message)); } catch {} }; };
const post = o => fetch(NTFY + topic, { method: 'POST', body: JSON.stringify(o) });
const gathered = p => new Promise(r => { if (p.iceGatheringState === 'complete') return r(); const t = setTimeout(r, 3500); p.addEventListener('icegatheringstatechange', () => { if (p.iceGatheringState === 'complete') { clearTimeout(t); r(); } }); });

  ch.onopen = () => { es && es.close(); mode = role; me = role === 'host' ? 0 : 1; setMenu(); show('menu'); toast(role === 'host' ? 'Друг подключился!' : 'Подключено! Ждём выбор игры'); };
  ch.onclose = () => { if (mode !== 'local') { toast('Связь потеряна'); toHome(); } };
  ch.onmessage = e => { const m = JSON.parse(e.data);
    if (m.k === 'play' && mode === 'guest') begin(GAMES.find(g => g.id === m.g)); else if (m.k === 'menu') toMenu();
    else if (m.k === 'st') snap = m.s; else if (m.k === 'in' && S && cur) cur.input(S, 1, m.x, m.y, m.ev); };
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') { toast('Не удалось соединиться напрямую. Попробуйте один Wi-Fi или режим «один телефон».'); } };
}
const rcode = () => Array.from({ length: 5 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random() * 32 | 0]).join('');
$('#bHost').onclick = async () => {
  const code = rcode(); topic = 'polegames-' + code; $('#code').textContent = code; $('#hostBox').hidden = true; $('#codeBox').hidden = false; netSt('Готовим соединение <span class="dots"><i></i><i></i><i></i></span>');

    listen(async m => { if (m.t === 'answer' && !pc.remoteDescription) await pc.setRemoteDescription({ type: 'answer', sdp: m.sdp }); });
    await post({ t: 'offer', sdp: pc.localDescription.sdp }); netSt('Комната открыта. Ждём друга <span class="dots"><i></i><i></i><i></i></span>'); }
  catch (e) { netSt('Не получилось создать комнату: ' + (e.message || e)); }
};
async function join(code) {
  code = code.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (code.length !== 5) return toast('Код — 5 символов'); topic = 'polegames-' + code; show('net'); netSt('Ищем комнату <span class="dots"><i></i><i></i><i></i></span>');
  try { pc = new RTCPeerConnection(ICE); pc.ondatachannel = e => wire(e.channel, 'guest');
    listen(async m => { if (m.t === 'offer' && !pc.remoteDescription) { netSt('Соединяемся…'); await pc.setRemoteDescription({ type: 'offer', sdp: m.sdp }); await pc.setLocalDescription(await pc.createAnswer()); await gathered(pc); await post({ t: 'answer', sdp: pc.localDescription.sdp }); } });

const link = () => location.href.split('#')[0] + '#' + $('#code').textContent;
$('#bShare').onclick = () => navigator.share ? navigator.share({ title: 'ПОЛЕ / ИГРЫ', text: 'Сыграем? Код комнаты ' + $('#code').textContent, url: link() }).catch(() => {}) : $('#bCopy').click();

/* ═════════ Input: pointers → canonical field coordinates (guest view is rotated 180°) ═════════ */
const cv = $('#cv'), c = cv.getContext('2d'); let SC = 1;

/* ═════════ Game over overlay ═════════ */

  $('#overTitle').textContent = win; $('#overTitle').style.color = w < 0 ? '#fff' : COL[w]; $('#overSub').textContent = cur.name;
  $('#bAgain').style.display = mode === 'guest' ? 'none' : ''; $('#bToMenu b').textContent = mode === 'guest' ? 'Выйти' : 'В меню'; $('#overWait').textContent = mode === 'guest' ? 'Реванш выбирает хозяин комнаты' : '';

}

/* ═════════ Animated background + main loop ═════════ */
const bg = $('#bg'), bx = bg.getContext('2d');

let prev = performance.now(), bgT = 0;
(function frame(now) {
  dt = Math.min(.04, (now - prev) / 1000); prev = now; if ((bgT -= dt) <= 0) { drawBg(now); bgT = .06; }

    if (st) { c.setTransform(SC, 0, 0, SC, 0, 0); if (mode === 'guest') { c.translate(FW, FH); c.rotate(PI); } cur.render(c, st, now / 1000); fxEv(st); drawFX(c);
      if (st.over && !overOn) showOver(st.w); else if (!st.over && overOn) hideOver(); }

})();
