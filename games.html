  init: () => ({ b: Array(42).fill(0), turn: 0, hov: 3, drop: null, win: null, over: false, w: -1, ev: 0, e: null }),

    if (s.sh) { glow(c, '#fff', 18); c.fillStyle = '#fff'; c.beginPath(); c.arc(s.sh.x, s.sh.y, 5, 0, 7); c.fill(); glow(c, 'transparent', 0); }
    text(c, (s.wind < 0 ? '← ' : '') + 'ветер ' + Math.abs(s.wind) + (s.wind > 0 ? ' →' : ''), 180, 24, 15, '#fff', 0, .75);
    if (!s.over) text(c, s.wait > 0 || s.sh ? '…' : 'ХОД ИГРОКА ' + (s.turn + 1) + ' — потяни назад и отпусти', 180, 52, 15, COL[s.turn], 0, .95);
  } };

/* ── Краска: paint more cells than your rival in 30 seconds; touch = splash (3 s cooldown) ── */
const PW = 18, PH = 32, PC = 20;
const paint = { id: 'paint', name: 'Краска', zone: 'half',
  init: () => ({ g: Array(PW * PH).fill(0), b: [{ x: 50, y: 590, tx: 50, ty: 590, cd: 0 }, { x: 310, y: 50, tx: 310, ty: 50, cd: 0 }], ph: 'cnt', t: 2.4, T: 30, ev: 0, e: null, over: false, w: -1 }),
  dab(s, b, p, r2) { const cx = b.x / PC | 0, cy = b.y / PC | 0, R = Math.ceil(Math.sqrt(r2)); for (let j = -R; j <= R; j++) for (let i = -R; i <= R; i++) { const x = cx + i, y = cy + j; if (i * i + j * j <= r2 && x >= 0 && x < PW && y >= 0 && y < PH) s.g[y * PW + x] = p + 1; } },
  input(s, p, x, y, ev) { const b = s.b[p]; if (ev === 'up') return; b.tx = clamp(x, 10, 350); b.ty = clamp(y, 10, 630);
    if (ev === 'down' && b.cd <= 0 && s.ph === 'play') { b.cd = 3; this.dab(s, b, p, 6); s.ev++; s.e = [b.x, b.y, p, 28]; } },
  step(s, dt) {
    if (s.over) return; s.b.forEach(b => b.cd = Math.max(0, b.cd - dt));
    if (s.ph === 'cnt') { s.t -= dt; if (s.t <= 0) s.ph = 'play'; return; }
    s.T -= dt; s.b.forEach((b, i) => { const dx = b.tx - b.x, dy = b.ty - b.y, d = Math.hypot(dx, dy), m = Math.min(d, 200 * dt); if (d > 1) { b.x += dx / d * m; b.y += dy / d * m; } this.dab(s, b, i, 1.2); });
    if (s.T <= 0) { s.over = true; const a = s.g.filter(v => v === 1).length, o = s.g.filter(v => v === 2).length; s.w = a === o ? -1 : a > o ? 0 : 1; }
  },
  render(c, s, t) {
    c.fillStyle = '#05060f'; c.fillRect(0, 0, FW, FH); let n = [0, 0];
    for (let i = 0; i < s.g.length; i++) { const v = s.g[i], x = (i % PW) * PC, y = (i / PW | 0) * PC; if (v) { n[v - 1]++; c.fillStyle = COL[v - 1]; c.globalAlpha = .8; rr(c, x + 1, y + 1, PC - 2, PC - 2, 5); c.fill(); } else { c.fillStyle = 'rgba(255,255,255,.04)'; c.globalAlpha = 1; rr(c, x + 2, y + 2, PC - 4, PC - 4, 5); c.fill(); } } c.globalAlpha = 1;
    const tot = PW * PH; text(c, Math.round(n[0] / tot * 100) + '%', 180, 480, 80, '#fff', 0, .25); text(c, Math.round(n[1] / tot * 100) + '%', 180, 160, 80, '#fff', PI, .25);
    s.b.forEach((b, i) => { glow(c, COL[i], 24); c.fillStyle = '#fff'; c.beginPath(); c.arc(b.x, b.y, 12, 0, 7); c.fill(); glow(c, 'transparent', 0); c.strokeStyle = COL[i]; c.lineWidth = 4; c.beginPath(); c.arc(b.x, b.y, 19, -PI / 2, -PI / 2 + 2 * PI * (1 - b.cd / 3)); c.stroke(); });
    c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(0, 316, FW, 8); c.fillStyle = '#fff'; c.fillRect(0, 316, FW * clamp(s.T / 30, 0, 1), 8); text(c, Math.ceil(Math.max(0, s.T)), 180, 320, 18, '#05060f', 0, 1);
    if (s.ph === 'cnt') { text(c, 'КРАСЬ!', 180, 320, 60, '#fff', 0, .9); text(c, 'веди пальцем · касание = плеск', 180, 580, 15, COL[0], 0, .8); text(c, 'веди пальцем · касание = плеск', 180, 60, 15, COL[1], PI, .8); }
  } };

const GAMES = [hockey, four, duel, tug, tron, sumo, arty, paint];
const ICONS = { hockey: '<circle cx="32" cy="32" r="26" fill="none" stroke="currentColor" opacity=".3" stroke-width="2"/><circle class="puck" cx="32" cy="32" r="7" fill="currentColor"/><rect x="21" y="53" width="22" height="5" rx="2.5" fill="currentColor"/>',
  four: '<circle cx="14" cy="50" r="7" fill="currentColor" opacity=".35"/><circle cx="32" cy="50" r="7" fill="#ff7aa8"/><circle cx="50" cy="50" r="7" fill="currentColor" opacity=".35"/><circle class="fall" cx="32" cy="18" r="7" fill="currentColor"/>',
  duel: '<circle class="flash" cx="32" cy="32" r="20" fill="currentColor"/>', tug: '<path d="M6 32h52" stroke="currentColor" stroke-width="3" opacity=".4"/><circle class="knot" cx="32" cy="32" r="9" fill="currentColor"/>' };
const DESC = { hockey: 'до 5 голов', four: 'классика', duel: 'кто быстрее', tug: 'жми быстрее' };
Object.assign(ICONS, {
  tron: '<path class="dash" d="M10 56V34h22V10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path class="dash" style="animation-delay:-1s" d="M54 8v22H34v26" fill="none" stroke="#ff7aa8" stroke-width="4" stroke-linecap="round"/>',
  sumo: '<circle cx="32" cy="32" r="28" fill="none" stroke="currentColor" opacity=".3" stroke-width="2"/><circle class="bA" cx="22" cy="32" r="9" fill="currentColor"/><circle class="bB" cx="42" cy="32" r="9" fill="#ff7aa8"/>',
  arty: '<path d="M2 56Q18 48 32 58T62 50V64H2Z" fill="currentColor" opacity=".35"/><path class="shot" d="M12 46Q32 -8 54 46" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="4 5"/>',
  paint: '<rect class="pop" x="8" y="8" width="14" height="14" rx="4" fill="currentColor"/><rect class="pop" style="animation-delay:-.4s" x="25" y="8" width="14" height="14" rx="4" fill="#ff7aa8"/><rect class="pop" style="animation-delay:-.8s" x="42" y="8" width="14" height="14" rx="4" fill="currentColor"/><rect class="pop" style="animation-delay:-1.2s" x="8" y="25" width="14" height="14" rx="4" fill="#ff7aa8"/><rect class="pop" style="animation-delay:-.2s" x="25" y="25" width="14" height="14" rx="4" fill="currentColor"/><rect class="pop" style="animation-delay:-.6s" x="42" y="25" width="14" height="14" rx="4" fill="#ff7aa8"/><rect class="pop" style="animation-delay:-1s" x="8" y="42" width="14" height="14" rx="4" fill="currentColor"/><rect class="pop" style="animation-delay:-.3s" x="25" y="42" width="14" height="14" rx="4" fill="#ff7aa8"/>' });
Object.assign(DESC, { tron: 'не врежься', sumo: 'столкни с арены', arty: 'ветер и воронки', paint: '30 секунд' });
GAMES.forEach(g => { const b = document.createElement('button'); b.className = 'game'; b.innerHTML = `<svg viewBox="0 0 64 64">${ICONS[g.id]}</svg><b>${g.name}</b><span>${DESC[g.id]}</span>`; b.onclick = () => host_start(g); $('#games').append(b); });

/* ═════════ Session: local / host / guest ═════════ */
let pc = null, dc = null, es = null, topic = '';
const send = o => { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(o)); };
function host_start(g) { if (mode === 'guest') return; begin(g); send({ k: 'play', g: g.id }); }
function begin(g) { cur = g; S = mode === 'guest' ? null : g.init(); snap = null; seen = 0; hideOver(); $('#playName').textContent = g.name; show('play'); fit(); }
function toMenu() { hideOver(); cur = null; S = null; snap = null; setMenu(); show('menu'); }
function setMenu() { $('#menuMode').textContent = mode === 'local' ? 'Один телефон' : mode === 'host' ? 'Вы — хозяин' : 'Вы — гость'; $('#menuHint').textContent = mode === 'guest' ? 'Игру выбирает хозяин комнаты' : ''; $$('.game').forEach(b => b.classList.toggle('lock', mode === 'guest')); }
function toHome() { try { pc && pc.close(); es && es.close(); } catch {} pc = dc = es = null; mode = 'local'; me = 0; cur = null; S = null; snap = null; hideOver(); show('home'); }
$('#bLocal').onclick = () => { mode = 'local'; me = 0; setMenu(); show('menu'); };
$('#bNet').onclick = () => { $('#netSt').textContent = ''; show('net'); };
$$('[data-go]').forEach(b => b.onclick = () => { if (b.dataset.go === 'home') toHome(); else show(b.dataset.go); });
$('#bMenuBack').onclick = toHome;
$('#bPlayBack').onclick = () => { if (mode === 'guest') return toast('Меню выбирает хозяин'); toMenu(); send({ k: 'menu' }); };
$('#bToMenu').onclick = () => mode === 'guest' ? toHome() : (toMenu(), send({ k: 'menu' }));
$('#bAgain').onclick = () => host_start(cur);

/* ═════════ Networking: WebRTC data channel; ntfy.sh only carries the 2-message handshake (room code = topic) ═════════ */
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] }, NTFY = 'https://ntfy.sh/';
const netSt = m => $('#netSt').innerHTML = m;
const listen = fn => { es = new EventSource(NTFY + topic + '/sse?since=all'); es.onmessage = e => { try { const m = JSON.parse(e.data); if (m.event === 'message') fn(JSON.parse(m.message)); } catch {} }; };
const post = o => fetch(NTFY + topic, { method: 'POST', body: JSON.stringify(o) });
const gathered = p => new Promise(r => { if (p.iceGatheringState === 'complete') return r(); const t = setTimeout(r, 3500); p.addEventListener('icegatheringstatechange', () => { if (p.iceGatheringState === 'complete') { clearTimeout(t); r(); } }); });
function wire(ch, role) {
  dc = ch;
  ch.onopen = () => { es && es.close(); mode = role; me = role === 'host' ? 0 : 1; setMenu(); show('menu'); toast(role === 'host' ? 'Друг подключился!' : 'Подключено! Ждём выбор игры'); };
  ch.onclose = () => { if (mode !== 'local') { toast('Связь потеряна'); toHome(); } };
  ch.onmessage = e => { const m = JSON.parse(e.data);
    if (m.k === 'play' && mode === 'guest') begin(GAMES.find(g => g.id === m.g)); else if (m.k === 'menu') toMenu();
    else if (m.k === 'st') snap = m.s; else if (m.k === 'in' && S && cur) cur.input(S, 1, m.x, m.y, m.ev); };
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') { toast('Не удалось соединиться напрямую. Попробуйте один Wi-Fi или режим «один телефон».'); } };
}
const rcode = () => Array.from({ length: 5 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random() * 32 | 0]).join('');
$('#bHost').onclick = async () => {
  const code = rcode(); topic = 'polegames-' + code; $('#code').textContent = code; $('#hostBox').hidden = true; $('#codeBox').hidden = false; netSt('Готовим соединение <span class="dots"><i></i><i></i><i></i></span>');
  try { pc = new RTCPeerConnection(ICE); wire(pc.createDataChannel('g'), 'host'); await pc.setLocalDescription(await pc.createOffer()); await gathered(pc);
    listen(async m => { if (m.t === 'answer' && !pc.remoteDescription) await pc.setRemoteDescription({ type: 'answer', sdp: m.sdp }); });
    await post({ t: 'offer', sdp: pc.localDescription.sdp }); netSt('Комната открыта. Ждём друга <span class="dots"><i></i><i></i><i></i></span>'); }
  catch (e) { netSt('Не получилось создать комнату: ' + (e.message || e)); }
};
async function join(code) {
  code = code.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (code.length !== 5) return toast('Код — 5 символов'); topic = 'polegames-' + code; show('net'); netSt('Ищем комнату <span class="dots"><i></i><i></i><i></i></span>');
  try { pc = new RTCPeerConnection(ICE); pc.ondatachannel = e => wire(e.channel, 'guest');
    listen(async m => { if (m.t === 'offer' && !pc.remoteDescription) { netSt('Соединяемся…'); await pc.setRemoteDescription({ type: 'offer', sdp: m.sdp }); await pc.setLocalDescription(await pc.createAnswer()); await gathered(pc); await post({ t: 'answer', sdp: pc.localDescription.sdp }); } });
    setTimeout(() => { if (mode !== 'guest' && scr === 'net') netSt('Комната не найдена. Проверьте код и что друг уже создал её.'); }, 20000); }
  catch (e) { netSt('Ошибка: ' + (e.message || e)); }
}
$('#bJoin').onclick = () => join($('#inCode').value);
$('#inCode').addEventListener('keydown', e => e.key === 'Enter' && join(e.target.value));
const link = () => location.href.split('#')[0] + '#' + $('#code').textContent;
$('#bShare').onclick = () => navigator.share ? navigator.share({ title: 'ПОЛЕ / ИГРЫ', text: 'Сыграем? Код комнаты ' + $('#code').textContent, url: link() }).catch(() => {}) : $('#bCopy').click();
$('#bCopy').onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(link()) : Promise.reject()).then(() => toast('Ссылка скопирована'), () => toast('Код: ' + $('#code').textContent)); };
if (/^#[A-Za-z0-9]{5}$/.test(location.hash)) { $('#inCode').value = location.hash.slice(1); setTimeout(() => { show('net'); join(location.hash.slice(1)); }, 300); }

/* ═════════ Input: pointers → canonical field coordinates (guest view is rotated 180°) ═════════ */
const cv = $('#cv'), c = cv.getContext('2d'); let SC = 1;
function fit() { const st = $('#stage').getBoundingClientRect(), k = Math.min(st.width - 16, (st.height - 8) * 9 / 16), d = Math.min(devicePixelRatio || 1, 2); cv.style.width = k + 'px'; cv.style.height = k * 16 / 9 + 'px'; cv.width = k * d; cv.height = k * 16 / 9 * d; SC = cv.width / FW; }
addEventListener('resize', fit);
const pts = {}; let lastMv = 0;
const where = e => { const r = cv.getBoundingClientRect(); let x = (e.clientX - r.left) / r.width * FW, y = (e.clientY - r.top) / r.height * FH; if (mode === 'guest' && !cur.noflip) { x = FW - x; y = FH - y; } return [x, y]; };
function fire(p, x, y, ev) { if (mode === 'guest') { if (ev === 'move' && performance.now() - lastMv < 30) return; lastMv = performance.now(); send({ k: 'in', x, y, ev }); } else if (S && cur) cur.input(S, p, x, y, ev); }
cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); const [x, y] = where(e); pts[e.pointerId] = mode === 'local' ? (cur.zone === 'turn' ? S.turn : y > FH / 2 ? 0 : 1) : me; fire(pts[e.pointerId], x, y, 'down'); });
cv.addEventListener('pointermove', e => { if (e.pointerId in pts) { const [x, y] = where(e); fire(pts[e.pointerId], x, y, 'move'); } });
const up = e => { if (e.pointerId in pts) { const [x, y] = where(e); fire(pts[e.pointerId], x, y, 'up'); delete pts[e.pointerId]; } };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

/* ═════════ Game over overlay ═════════ */
function hideOver() { overOn = false; $('#over').classList.remove('on'); }
function showOver(w) {
  overOn = true; const online = mode !== 'local', win = w === -1 ? 'Ничья' : online ? (w === me ? 'Победа!' : 'Поражение') : 'Игрок ' + (w + 1) + ' победил';
  $('#overTitle').textContent = win; $('#overTitle').style.color = w < 0 ? '#fff' : COL[w]; $('#overSub').textContent = cur.name;
  $('#bAgain').style.display = mode === 'guest' ? 'none' : ''; $('#bToMenu b').textContent = mode === 'guest' ? 'Выйти' : 'В меню'; $('#overWait').textContent = mode === 'guest' ? 'Реванш выбирает хозяин комнаты' : '';
  setTimeout(() => overOn && $('#over').classList.add('on'), 900); if (w >= 0) { for (let i = 0; i < 6; i++) setTimeout(() => burst(rnd(40, 320), rnd(100, 540), COL[w], 22), i * 120); beep(660, .3); }
}

/* ═════════ Animated background + main loop ═════════ */
const bg = $('#bg'), bx = bg.getContext('2d');
const rgba = (h, a) => { const n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; };
const drawBg = t => { bg.width = innerWidth / 2; bg.height = innerHeight / 2; bx.fillStyle = '#07080f'; bx.fillRect(0, 0, bg.width, bg.height); bx.globalCompositeOperation = 'lighter';
  [[COL[0], .25, .3, .5], [COL[1], .75, .65, .43], ['#7a6bff', .5, .9, .6]].forEach(([col, ax, ay, r], i) => { const x = bg.width * (ax + Math.sin(t * .00013 * (i + 2)) * .25), y = bg.height * (ay + Math.cos(t * .00011 * (i + 3)) * .2), R = Math.max(bg.width, bg.height) * r, g = bx.createRadialGradient(x, y, 0, x, y, R); g.addColorStop(0, rgba(col, .33)); g.addColorStop(1, 'rgba(0,0,0,0)'); bx.fillStyle = g; bx.fillRect(0, 0, bg.width, bg.height); }); bx.globalCompositeOperation = 'source-over'; };
$$('#pal button').forEach((b, i) => b.onclick = () => { COL[0] = ACC[i]; document.documentElement.style.setProperty('--a', ACC[i]); });
let prev = performance.now(), bgT = 0;
(function frame(now) {
  dt = Math.min(.04, (now - prev) / 1000); prev = now; if ((bgT -= dt) <= 0) { drawBg(now); bgT = .06; }
  if (scr === 'play' && cur) {
    if (mode !== 'guest' && S) { cur.step(S, dt); if (mode === 'host' && (sendT -= dt) <= 0) { sendT = .033; send({ k: 'st', s: S }); } }
    const st = mode === 'guest' ? snap : S;
    if (st) { c.setTransform(SC, 0, 0, SC, 0, 0); if (mode === 'guest' && !cur.noflip) { c.translate(FW, FH); c.rotate(PI); } cur.render(c, st, now / 1000); fxEv(st); drawFX(c);
      if (st.over && !overOn) showOver(st.w); else if (!st.over && overOn) hideOver(); }
  }
  requestAnimationFrame(frame);
})(prev);
})();
</script>
